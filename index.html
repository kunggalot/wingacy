    --font-display: 800 1rem/1.1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-body: 500 0.95rem/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: 500 0.72rem/1 ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  /* light is the default regardless of OS preference (no
     prefers-color-scheme:dark block) — dark only activates when a host
     explicitly stamps data-theme="dark" below */
  :root[data-theme="dark"]{
    color-scheme: dark;
    --stage: #060605;
    --surface: #0C0C0A;
    --card: #131209;
    --ink: #F3F0E8;
    --muted: #8A8574;
    --line: rgba(243,240,232,0.14);
    --invert-bg: #F3F0E8;
    --invert-fg: #0C0C0A;
    --shadow: 0 40px 90px -30px rgba(0,0,0,0.7);
    --accent-text: #96B4C6;
  }
  :root[data-theme="light"]{
    --stage: #DCD8CC;
    --surface: #FAF8F2;
    --card: #F1EEE4;
    --ink: #100F0A;
    --muted: #6E6A59;
    --line: rgba(16,15,10,0.14);
    --invert-bg: #100F0A;
    --invert-fg: #FAF8F2;
    --shadow: 0 40px 80px -30px rgba(16,15,10,0.35);
    --accent-text: #3D5A6D;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--surface);
    color: var(--ink);
    font: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .stage{ width: 100%; }

  .screen{
    position: relative;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    background: var(--surface);
    border-inline: 1px solid var(--line);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .views{ flex: 1; }

  /* --- hoverable: tight invert rectangle wipes in from the left --- */
  .hoverable{
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 7px;
    color: var(--ink);
    text-decoration: none;
    background: transparent;
    border: none;
    cursor: pointer;
    font: var(--font-body);
    font-size: 0.66rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    isolation: isolate;
  }
  .hoverable::before{
    content: "";
    position: absolute;
    inset: 0;
    background: var(--invert-bg);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.28s cubic-bezier(0.62,0.05,0.15,1);
    z-index: -1;
  }
  .hoverable svg{ stroke: var(--ink); }
  .hoverable span, .hoverable svg{
    position: relative;
    transition: color 0.24s ease, stroke 0.24s ease, transform 0.28s cubic-bezier(0.62,0.05,0.15,1);
  }
  .hoverable:hover::before,
  .hoverable:focus-visible::before{ transform: scaleX(1); }
  .hoverable:hover span,
  .hoverable:focus-visible span{ color: var(--invert-fg); transform: translateX(2px); }
  .hoverable:hover svg,
  .hoverable:focus-visible svg{ stroke: var(--invert-fg); }
  .hoverable:focus-visible{ outline: none; }
  .hoverable:focus-visible::before{ transform: scaleX(1); }

  /* --- nav --- */
  .navbar{
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 16px var(--gutter);
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand img{
    height: 18px;
    width: auto;
    display: block;
    filter: invert(var(--logo-invert, 1)); /* default = light theme (inverted white->black logo) */
  }
  :root[data-theme="light"] .brand img{ --logo-invert: 1; }
  :root[data-theme="dark"] .brand img{ --logo-invert: 0; }

  .brand span{
    font: var(--font-display);
    letter-spacing: 0.02em;
    font-size: 0.95rem;
  }
  .navbar-right{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bag{
    position: relative;
    gap: 0;
    margin-right: -7px;
  }
  .bag svg{
    transform: translateY(-1px); /* icon ink sits ~1px below its box center vs the digit */
  }
  .hoverable:hover .bag-count,
  .hoverable:focus-visible .bag-count{
    transform: none; /* don't inherit the nav-text hover nudge — keeps icon/number gap fixed on hover */
  }
  .bag-count{

  const fmt = (n) => `฿${n.toLocaleString('en-US')}`;
  const tpl = document.getElementById('cardTpl');
  const swatchImgSrc = tpl.content.querySelector('.swatch img').src;
  const shopGrid = document.getElementById('gridShop');
  function isSoldOut(p){
    return p.sizes.every((s) => !s.inStock);
  }

  /* --- shared card builder: used by the shop grids so the sold-out badge
     and click-to-PDP wiring stay in one place. --- */
  function buildCard(p){
    const node = tpl.content.cloneNode(true);
    const card = node.querySelector('.card');
    const swatch = node.querySelector('.swatch');
    // real product photo, once shot, replaces the shared logo-watermark placeholder
    if (p.photo){
      swatch.classList.add('has-photo');
      const img = swatch.querySelector('img');
      img.src = p.photo;
      // second angle swapped in on hover, see setupTilt below
      if (p.photoHover){ img._photoDefault = p.photo; img._photoHover = p.photoHover; }
    }
    node.querySelector('.name').textContent = p.name;
    node.querySelector('.price').textContent = fmt(p.price);
    node.querySelector('.sold-out-badge').hidden = !isSoldOut(p);
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `${p.name}, ${fmt(p.price)}`);
    card.addEventListener('click', () => openProduct(p.id));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProduct(p.id); }
    });
    return card;
  }

  function renderShop(){
    shopGrid.innerHTML = '';
    products.forEach((p) => shopGrid.appendChild(buildCard(p)));
    // re-renders replace the card nodes, so freshly-created swatches need tilt
    // wiring again; undefined on the very first render (tilt module isn't
    // parsed yet — its IIFE binds that initial batch itself)
    if (typeof rebindSwatchTilt === 'function') rebindSwatchTilt();
  }

  renderShop();

  /* --- product detail: card click populates the PDP fields, then shows it --- */
  let currentProduct = null;
  let selectedSize = null;
  const pdpGallery = document.getElementById('pdpGallery');
  const pdpDots = document.getElementById('pdpDots');
  let galleryIndex = 0;

  function showGalleryImage(i){
    const items = [...pdpGallery.children];
    galleryIndex = (i + items.length) % items.length;
    items.forEach((item, idx) => { item.hidden = idx !== galleryIndex; });
    [...pdpDots.children].forEach((dot, idx) => dot.setAttribute('aria-current', String(idx === galleryIndex)));
  }

  /* --- drag/swipe (mouse on desktop, touch on mobile — Pointer Events cover both)
     plus trackpad/wheel, so the gallery is browsable without the removed arrow buttons --- */
  const SWIPE_THRESHOLD = 40;
  let dragStartX = null;
  pdpGallery.addEventListener('pointerdown', (e) => { dragStartX = e.clientX; });
  pdpGallery.addEventListener('pointerup', (e) => {
    if (dragStartX === null) return;
    const delta = e.clientX - dragStartX;
    dragStartX = null;
    if (Math.abs(delta) < SWIPE_THRESHOLD) return;
    showGalleryImage(galleryIndex + (delta < 0 ? 1 : -1));
  });
  pdpGallery.addEventListener('pointercancel', () => { dragStartX = null; });

  let wheelCooldown = false;
  pdpGallery.addEventListener('wheel', (e) => {
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(delta) < 15 || wheelCooldown) return;
    e.preventDefault();
    wheelCooldown = true;
    showGalleryImage(galleryIndex + (delta > 0 ? 1 : -1));
    setTimeout(() => { wheelCooldown = false; }, 350);
  }, { passive: false });

  const pdpName = document.getElementById('pdpName');
  const pdpPrice = document.getElementById('pdpPrice');
  const pdpSizes = document.getElementById('pdpSizes');
  const pdpError = document.getElementById('pdpError');
  const pdpAdd = document.getElementById('pdpAdd');

  function openProduct(id){
    currentProduct = products.find((p) => p.id === id);
    if (!currentProduct) return;
    selectedSize = null;
    pdpGallery.innerHTML = '';
    pdpDots.innerHTML = '';
    for (let i = 0; i < currentProduct.imageCount; i++) {
      const item = document.createElement('div');
      item.className = 'pdp-gallery-item';
      item.hidden = i !== 0;
      item.innerHTML = `<img src="${swatchImgSrc}" alt="" />`;
      pdpGallery.appendChild(item);

      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'pdp-dot';
      dot.setAttribute('aria-label', `Image ${i + 1}`);
      dot.setAttribute('aria-current', String(i === 0));
      dot.addEventListener('click', () => showGalleryImage(i));
      pdpDots.appendChild(dot);
    }
    galleryIndex = 0;
    pdpName.textContent = currentProduct.name;
    pdpPrice.textContent = fmt(currentProduct.price);
    pdpError.hidden = true;

    pdpSizes.innerHTML = '';
    // a single size (e.g. "One Size") isn't really a choice — pre-select it so
    // it doesn't block Add to Cart on a click that has nothing to decide
    const onlySize = currentProduct.sizes.length === 1 && currentProduct.sizes[0].inStock
      ? currentProduct.sizes[0].size : null;
    if (onlySize) selectedSize = onlySize;
    currentProduct.sizes.forEach(({ size, inStock }) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'hoverable size-chip';
      chip.setAttribute('aria-pressed', String(size === onlySize));
      chip.disabled = !inStock;
      chip.innerHTML = `<span>${size}</span>`;
      chip.addEventListener('click', () => {
        selectedSize = size;
        pdpError.hidden = true;
        [...pdpSizes.children].forEach((c) => c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'));
      });
      pdpSizes.appendChild(chip);
    });

    show('product');
  }

  pdpAdd.addEventListener('click', () => {
    if (!selectedSize) {
      pdpError.textContent = 'Please select a size';
      pdpError.hidden = false;
      return;
    }
    addToCart(currentProduct.id, selectedSize, 1);
    const span = pdpAdd.querySelector('span');
    span.textContent = 'Added';
    setTimeout(() => { span.textContent = 'Add to Cart'; }, 900);
  });

  /* --- cart: line items are { id, size, qty }, merged on repeat add-to-cart --- */
  let cart = [];
  const cartTpl = document.getElementById('cartLineTpl');
  const cartList = document.getElementById('cartList');
  const cartEmpty = document.getElementById('cartEmpty');
  const cartSummary = document.getElementById('cartSummary');
  const cartSubtotalEl = document.getElementById('cartSubtotal');
  const cartItemCount = document.getElementById('cartItemCount');
  const bagCount = document.getElementById('bagCount');

  function findLine(id, size){
    return cart.find((l) => l.id === id && l.size === size);
  }

  function addToCart(id, size, qty){
    const line = findLine(id, size);
    if (line) line.qty += qty;
    else cart.push({ id, size, qty });
    updateBagCount();
  }

  function changeQty(id, size, delta){
    const line = findLine(id, size);
    if (!line) return;
    line.qty += delta;
    if (line.qty <= 0) cart = cart.filter((l) => l !== line);
    updateBagCount();
    renderCart();
  }

  function removeLine(id, size){
    cart = cart.filter((l) => !(l.id === id && l.size === size));
    updateBagCount();
    renderCart();
  }

  function cartCount(){
    return cart.reduce((sum, l) => sum + l.qty, 0);
  }

  function cartSubtotal(){
    return cart.reduce((sum, l) => {
      const p = products.find((pp) => pp.id === l.id);
      return sum + (p ? p.price * l.qty : 0);
    }, 0);
  }

  function updateBagCount(){
    bagCount.textContent = cartCount();
  }

  function renderCart(){
    cartList.innerHTML = '';
    cartItemCount.textContent = `(${cartCount()})`;
    cartEmpty.hidden = cart.length > 0;
    cartSummary.hidden = cart.length === 0;
    cart.forEach((line) => {
      const p = products.find((pp) => pp.id === line.id);
      if (!p) return;
      const node = cartTpl.content.cloneNode(true);
      node.querySelector('img').src = swatchImgSrc;
      node.querySelector('.cart-line-name').textContent = p.name;
      node.querySelector('.cart-line-price').textContent = fmt(p.price * line.qty);
      node.querySelector('.cart-line-size').textContent = `Size ${line.size}`;
      node.querySelector('.qty-value').textContent = line.qty;
      node.querySelector('.qty-minus').addEventListener('click', () => changeQty(line.id, line.size, -1));
      node.querySelector('.qty-plus').addEventListener('click', () => changeQty(line.id, line.size, 1));
      node.querySelector('.remove').addEventListener('click', () => removeLine(line.id, line.size));
      cartList.appendChild(node);
    });
    cartSubtotalEl.textContent = fmt(cartSubtotal());
  }

  /* --- hero tilt: exact port of wingacy.com (window mousemove -> rAF lerp
     -> GPU transform). Cursor anywhere on screen tilts the photo. --- */
  (function heroTilt(){
    const wrap = document.getElementById('heroFrame');
    if (!wrap) return;

    const MAX = 5;        // MAX_TILT_DEG
    const EASE = 0.1;     // TILT_EASE
    const PERSP = 800;    // PERSPECTIVE
    const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

    let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;
    let raf = null, running = false;

    const onMove = (e) => {
      if (wrap.offsetParent === null) return;   // hero not visible (Shop/other view) -> ignore
      const r = wrap.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const px = clamp((e.clientX - cx) / (r.width / 2), -1, 1);
      const py = clamp((e.clientY - cy) / (r.height / 2), -1, 1);
      targetRX = clamp(-py * MAX, -MAX, MAX);
      targetRY = clamp(px * MAX, -MAX, MAX);
    };

    const tick = () => {
      curRX += (targetRX - curRX) * EASE;
      curRY += (targetRY - curRY) * EASE;
      wrap.style.transform =
        `perspective(${PERSP}px) rotateX(${curRX.toFixed(3)}deg) rotateY(${curRY.toFixed(3)}deg)`;
      raf = requestAnimationFrame(tick);
    };

    const start = () => { if (!running){ running = true; if (raf == null) raf = requestAnimationFrame(tick); } };
    const stop  = () => { running = false; if (raf) cancelAnimationFrame(raf); raf = null; };

    window.addEventListener('mousemove', onMove, { passive: true });
    document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); }, { passive: true });
    start();
  })();

  /* --- vanilla tilt: passive mousemove -> rAF + lerp -> GPU transform ---
     Explicitly requested effect, so it runs regardless of the reduced-motion
     hint. Swatch tilts in 3D; the inner logo parallaxes the other way for
     depth, and the tile lifts slightly so the motion is unmistakable. */
  (function setupTilt(){
    /* renderShop() replaces the card nodes on every category switch, so the
       hover listener must be (re)attached to whatever swatches are in the DOM
       now. _hoverBound marks a swatch as already wired (idempotent rebind). */
    function bind(){
      document.querySelectorAll('.swatch').forEach((swatch) => {
        if (swatch._hoverBound) return;
        swatch._hoverBound = true;
        // demo only: no second product photo exists yet, so hover swaps the
        // logo's color instead of an image src
        swatch.addEventListener('mouseenter', () => {
          swatch.classList.add('is-swap');
          const img = swatch.querySelector('img');
          if (img._photoHover) img.src = img._photoHover;
        }, { passive: true });
        swatch.addEventListener('mouseleave', () => {
          swatch.classList.remove('is-swap');
          const img = swatch.querySelector('img');
          if (img._photoDefault) img.src = img._photoDefault;
        }, { passive: true });
      });
    }
    bind();
    window.rebindSwatchTilt = bind;
  })();
</script>
